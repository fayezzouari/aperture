[project]
name = "aperture-core"
version = "0.1.0"
description = "Shared inference pipeline, config schema and presets for Aperture"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pillow>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aperture_core"]
