global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    instance_name: aperture

scrape_configs:
  - job_name: aperture-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Runtime containers are scaled with compose replicas, so they are discovered
  # by DNS rather than listed one by one.
  - job_name: aperture-runtime
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["runtime"]
        type: A
        port: 9100

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
