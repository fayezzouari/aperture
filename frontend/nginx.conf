server {
    listen 8080;
    server_name _;

    # Docker's embedded DNS, re-checked every 10 s. An `upstream` block would
    # resolve `api` once at boot and keep pointing at a dead IP after the API
    # container is recreated, which is exactly what happens on every deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host "api:8000";
    set $mcp_host "mcp:8090";

    # Weights uploads arrive in chunks, but a chunk can still be 32 MB+.
    client_max_body_size 512m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /v1/ {
        proxy_pass http://$api_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://$api_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The shared MCP server. Agents send their own bearer token; nothing here
    # streams (stateless, JSON responses), but a predict can take as long as the
    # model does, hence the API's timeouts above.
    location = /mcp {
        proxy_pass http://$mcp_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # OAuth discovery for MCP clients: the MCP server describes the resource it
    # protects (RFC 9728), the API is the authorization server (RFC 8414). The
    # consent page itself, /oauth/authorize, is a console route.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://$mcp_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://$api_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The internal control channel is not reachable from the browser edge.
    location /internal/ {
        return 404;
    }

    location /downloads/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
