[project]
name = "aperture-runtime"
version = "0.1.0"
description = "Aperture inference runtime: holds model versions resident and serves batched inference"
requires-python = ">=3.11"
dependencies = [
    "aperture-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pillow>=10.3",
    "boto3>=1.34",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.18"]
torch = ["torch>=2.3", "torchvision>=0.18"]

[tool.uv.sources]
aperture-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime"]
